<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="560" fill="white"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">PSLAE: one authentication session</text>
<rect x="60" y="50" width="200" height="50" rx="8" fill="#d6ecff" stroke="#2b6cb0"/><text x="160" y="80" text-anchor="middle" font-size="16">6LN  (sensor)</text>
<rect x="640" y="50" width="200" height="50" rx="8" fill="#d9f2d9" stroke="#2f855a"/><text x="740" y="80" text-anchor="middle" font-size="16">6LC  (controller)</text>
<line x1="160" y1="100" x2="160" y2="520" stroke="#2b6cb0" stroke-dasharray="6 5"/><line x1="740" y1="100" x2="740" y2="520" stroke="#2f855a" stroke-dasharray="6 5"/>
<text x="450" y="135" text-anchor="middle" font-size="13" fill="#555">0. Registration (once, secure channel): both sides receive shared secrets - nothing on the air</text>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<line x1="165" y1="190" x2="735" y2="190" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="178" text-anchor="middle" font-size="15" font-weight="bold">M1  (416 bits)</text>
<text x="450" y="212" text-anchor="middle" font-size="12">T6LN | D (masked alias) | CT (encrypted A||B) | Tag | RN1</text>
<text x="170" y="245" font-size="12" fill="#2b6cb0">AKE1: fresh RN1, timestamp,</text><text x="170" y="260" font-size="12" fill="#2b6cb0">mask alias, encrypt, add tag</text>
<text x="730" y="290" text-anchor="end" font-size="12" fill="#2f855a">AKE2: check time, alias, tag, RN1, Sc</text><text x="730" y="305" text-anchor="end" font-size="12" fill="#2f855a">then compute session key SK and M = SHA-1(SK)</text>
<line x1="735" y1="350" x2="165" y2="350" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="338" text-anchor="middle" font-size="15" font-weight="bold">M2  (608 bits, reconstructed T6C = 64 bit; 576 with the paper's 32 bit)</text>
<text x="450" y="372" text-anchor="middle" font-size="12">T6C | A1 | M | CT1 (encrypted Sc1||RN2) | Tag | RN2</text>
<text x="170" y="410" font-size="12" fill="#2b6cb0">AKE3: check time, A1, tag, M</text><text x="170" y="425" font-size="12" fill="#2b6cb0">compute the SAME SK itself</text>
<rect x="250" y="455" width="400" height="44" rx="8" fill="#fff5d6" stroke="#b7791f"/><text x="450" y="482" text-anchor="middle" font-size="14">Session key SK exists on both sides - it was never sent</text>
<rect x="330" y="215" width="240" height="46" rx="8" fill="#ffe0e0" stroke="#c53030" stroke-dasharray="4 3"/><text x="450" y="235" text-anchor="middle" font-size="12" fill="#c53030">attacker on the radio link:</text><text x="450" y="251" text-anchor="middle" font-size="12" fill="#c53030">read / replay / edit / drop</text>
</svg>